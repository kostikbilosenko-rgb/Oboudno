<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Oboudno - Web Panel</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            color: #4CAF50;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 150px;
            font-family: monospace;
        }
        button {
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Project Oboudno Control Panel</h2>
    
    <label for="nickname">Твой ник (Whitelist):</label>
    <input type="text" id="nickname" value="sewarg47">

    <label for="placeId">ID Плейса (Place ID):</label>
    <input type="text" id="placeId" placeholder="Введите ID игры">

    <label for="commandCode">Lua Скрипт для выполнения:</label>
    <textarea id="commandCode" placeholder="print('Hello from Oboudno!')"></textarea>

    <button onclick="sendScript()">Выполнить скрипт</button>

    <div id="status"></div>
</div>

<script>
    // Твой актуальный бэкенд URL на Vercel
    const BACKEND_URL = "https://oboudno-backend.vercel.app";

    async function sendScript() {
        const nick = document.getElementById('nickname').value;
        const placeId = document.getElementById('placeId').value;
        const command = document.getElementById('commandCode').value;
        const statusDiv = document.getElementById('status');

        if (!placeId || !command) {
            statusDiv.style.color = '#ff5252';
            statusDiv.innerText = 'Заполни Place ID и скрипт!';
            return;
        }

        statusDiv.style.color = '#ffa726';
        statusDiv.innerText = 'Отправка команды на сервер...';

        try {
            const response = await fetch(`${BACKEND_URL}/set-script`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ placeId, command, nick })
            });

            const data = await response.json();

            if (data.success) {
                statusDiv.style.color = '#66bb6a';
                statusDiv.innerText = 'Успешно! Скрипт отправлен в очередь плейса.';
            } else if (data.status === 'not_in_whitelist') {
                statusDiv.style.color = '#ff5252';
                statusDiv.innerText = 'Ошибка: Твоего ника нет в вайтлисте!';
            } else {
                statusDiv.style.color = '#ff5252';
                statusDiv.innerText = 'Ошибка выполнения запроса.';
            }
        } catch (error) {
            statusDiv.style.color = '#ff5252';
            statusDiv.innerText = 'Ошибка соединения с бэкендом!';
            console.error(error);
        }
    }
</script>

</body>
</html>
